name: Scrape Dapodik

on:
  workflow_dispatch:   # trigger manual dari tab "Actions" di GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # 1 jenjang gagal, yang lain tetep lanjut
      matrix:
        jenjang: [SD, SMP, SMA, SMK]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright openpyxl pandas
          playwright install --with-deps chromium

      - name: Scrape
        run: python scrape_full.py --jenjang "${{ matrix.jenjang }}" --provinsi "Jawa Timur"

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: hasil-${{ matrix.jenjang }}-JawaTimur
          path: "*.xlsx"
          if-no-files-found: ignore
